name: Atualizar gráfico de escolaridade

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar as bibliotecas
        run: pip install pandas matplotlib plotly requests

      - name: Rodar o pipeline
        run: python pipeline.py

      - name: Rodar o grafico interativo
        run: python grafico_interativo.py

      - name: Salvar o gráfico atualizado de volta no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add grafico_escolaridade_rio.png grafico_interativo.html
          git diff --staged --quiet || git commit -m "Atualiza grafico automaticamente"
          git push

      - name: Enviar o gráfico por e-mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.mail.yahoo.com
          server_port: 465
          username: ${{ secrets.EMAIL_USUARIO }}
          password: ${{ secrets.EMAIL_SENHA_APP }}
          to: ${{ secrets.EMAIL_DESTINO }}
          from: ${{ secrets.EMAIL_REMETENTE }}
          subject: Grafico de Escolaridade Atualizado - Rio de Janeiro
          body: |
            Segue em anexo o grafico atualizado de escolaridade do municipio do Rio de Janeiro, com dados do Censo 2022:

            Veja tambem a versao interativa, com filtro por municipio:
            https://aepelbaum.github.io/ibge-escolaridade/grafico_interativo.html
          attachments: grafico_escolaridade_rio.png
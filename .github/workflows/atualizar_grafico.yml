name: Atualizar gráfico de escolaridade

on:
  schedule:
    - cron: '0 6 1 * *'  # roda às 6h (UTC) do dia 1 de cada mês
  workflow_dispatch:  # permite rodar manualmente também, pelo site do GitHub

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar as bibliotecas
        run: pip install pandas matplotlib requests

      - name: Rodar o pipeline
        run: python pipeline.py

      - name: Salvar o gráfico atualizado de volta no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add grafico_escolaridade_rio.png
          git diff --staged --quiet || git commit -m "Atualiza gráfico automaticamente"
          git push